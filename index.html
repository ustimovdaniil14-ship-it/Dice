<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Кубик: чёт / нечёт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg1: #0a0d1c;
    --bg2: #1a1040;
    --card: rgba(255,255,255,.06);
    --card2: rgba(255,255,255,.11);
    --text: #f4f5ff;
    --muted: #9a9fc4;
    --gold1: #ffe27a;
    --gold2: #ffb300;
    --win: #35e08a;
    --lose: #ff5d6c;
    --size: 120px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    background:
      radial-gradient(circle at 20% 0%, rgba(120,70,255,.35), transparent 50%),
      radial-gradient(circle at 90% 30%, rgba(255,60,140,.18), transparent 45%),
      linear-gradient(160deg, var(--bg2), var(--bg1));
    background-attachment: fixed;
  }
  .app { width: 100%; max-width: 440px; padding: 16px 16px 28px; }

  /* top bar */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .balance {
    background: var(--card); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(10px); border-radius: 16px; padding: 10px 18px;
    font-size: 21px; font-weight: 800; display: flex; align-items: center; gap: 8px;
  }
  .balance .star { filter: drop-shadow(0 0 6px rgba(255,200,0,.7)); }
  .balance span { background: linear-gradient(180deg, var(--gold1), var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .balance.pop { animation: pop .4s; }
  @keyframes pop { 40% { transform: scale(1.12); } }
  .bonus {
    background: var(--card2); color: var(--text); border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px; padding: 11px 14px; font-size: 14px; font-weight: 600;
  }
  .bonus:disabled { opacity: .4; }

  /* stage */
  .stage {
    position: relative; overflow: hidden; border-radius: 24px; margin-bottom: 14px;
    padding: 34px 16px 20px; text-align: center;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(30,160,100,.55), transparent 65%),
      linear-gradient(180deg, #14183a, #0c1030);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 0 60px rgba(0,0,0,.45);
  }
  .scene { perspective: 700px; height: 190px; display: flex; align-items: center; justify-content: center; position: relative; }
  .toss { position: relative; width: var(--size); height: var(--size); transform-style: preserve-3d; }
  .toss.go { animation: toss 1.7s cubic-bezier(.3,.1,.3,1); }
  @keyframes toss {
    0%   { transform: translateY(0) scale(1); }
    38%  { transform: translateY(-62px) scale(1.18); }
    62%  { transform: translateY(0) scale(1); }
    74%  { transform: translateY(-16px) scale(1.04); }
    88%  { transform: translateY(0) scale(1); }
    94%  { transform: translateY(-4px); }
    100% { transform: translateY(0); }
  }
  .tilt { width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(-24deg); }
  .cube {
    position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
    transition: transform 1.7s cubic-bezier(.15,.7,.2,1);
  }
  .face {
    position: absolute; width: var(--size); height: var(--size);
    border-radius: 10px; padding: 15px;
    display: grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    background:
      radial-gradient(circle at 30% 25%, #ffffff, #e9ecf6 55%, #c9cee2);
    box-shadow: inset 0 0 14px rgba(0,0,0,.18), inset 0 0 0 2px rgba(255,255,255,.7);
    backface-visibility: visible;
  }
  .core { position: absolute; width: var(--size); height: var(--size); background: #d9ddee; backface-visibility: visible; }
  .c1 { transform: none; }
  .c2 { transform: rotateY(90deg); }
  .c3 { transform: rotateX(90deg); }
  .f1 { transform: rotateY(0deg)   translateZ(calc(var(--size) / 2)); }
  .f6 { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
  .f3 { transform: rotateY(90deg)  translateZ(calc(var(--size) / 2)); }
  .f4 { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
  .f2 { transform: rotateX(90deg)  translateZ(calc(var(--size) / 2)); }
  .f5 { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }
  .pip {
    width: 78%; height: 78%; margin: auto; border-radius: 50%; visibility: hidden;
    background: linear-gradient(145deg, #3a3f6b, #1a1d3a);
    box-shadow: inset 0 -3px 5px rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.25);
  }
  .pip.on { visibility: visible; }
  .f1 .pip.on { background: linear-gradient(145deg, #ff6a78, #d3152f); box-shadow: inset 0 -3px 5px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.25); }

  .shadow {
    position: absolute; bottom: 4px; left: 50%; width: 110px; height: 22px; margin-left: -55px;
    background: radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%);
  }
  .shadow.go { animation: shadow 1.7s cubic-bezier(.3,.1,.3,1); }
  @keyframes shadow {
    0% { transform: scale(1); opacity: 1; }
    38% { transform: scale(.6); opacity: .45; }
    62% { transform: scale(1); opacity: 1; }
    74% { transform: scale(.85); opacity: .75; }
    88%,100% { transform: scale(1); opacity: 1; }
  }

  .result { min-height: 28px; margin-top: 8px; font-size: 18px; font-weight: 800; }
  .result.win { color: var(--win); text-shadow: 0 0 14px rgba(53,224,138,.5); }
  .result.lose { color: var(--lose); }

  /* confetti */
  .conf { position: absolute; top: 40%; left: 50%; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; opacity: 0; }
  @keyframes fly {
    0% { opacity: 1; transform: translate(0,0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); }
  }

  /* controls */
  .label { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin: 16px 2px 8px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  button { font-family: inherit; cursor: pointer; transition: transform .1s; }
  button:active { transform: scale(.96); }
  button.opt {
    background: var(--card); color: var(--text); border: 2px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 15px 6px; font-size: 16px; font-weight: 700;
  }
  button.opt.sel {
    border-color: var(--gold2); background: rgba(255,179,0,.14);
    box-shadow: 0 0 18px rgba(255,179,0,.25);
  }
  .picks button.opt { padding: 18px 6px; font-size: 17px; line-height: 1.3; }
  .picks small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .picks button.sel.even { border-color: #6ea8ff; background: rgba(110,168,255,.15); box-shadow: 0 0 18px rgba(110,168,255,.3); }
  .picks button.sel.odd  { border-color: #ff7ad1; background: rgba(255,122,209,.15); box-shadow: 0 0 18px rgba(255,122,209,.3); }

  .custom {
    width: 100%; margin-top: 8px; background: var(--card); color: var(--text);
    border: 2px solid rgba(255,255,255,.08); border-radius: 16px; padding: 14px; font-size: 16px; outline: none;
  }
  .custom:focus, .custom.sel { border-color: var(--gold2); }
  .go-btn {
    width: 100%; margin-top: 18px; border: 0; border-radius: 18px; padding: 18px;
    font-size: 19px; font-weight: 900; color: #2a1c00;
    background: linear-gradient(180deg, var(--gold1), var(--gold2));
    box-shadow: 0 8px 24px rgba(255,170,0,.35), inset 0 2px 0 rgba(255,255,255,.5);
  }
  .go-btn:disabled { opacity: .5; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 12px; }
  .history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 14px; min-height: 28px; }
  .history b { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; }
  .history b.w { background: rgba(53,224,138,.18); color: var(--win); }
  .history b.l { background: rgba(255,93,108,.18); color: var(--lose); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="balance" id="balBox"><span class="star">⭐</span><span id="bal">0</span></div>
    <button class="bonus" id="bonus">🎁 Бонус</button>
  </div>

  <div class="stage" id="stage">
    <div class="scene">
      <div class="shadow" id="shadow"></div>
      <div class="toss" id="toss">
        <div class="tilt">
          <div class="cube" id="cube">
            <div class="core c1"></div>
            <div class="core c2"></div>
            <div class="core c3"></div>
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
            <div class="face f5"></div>
            <div class="face f6"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="result" id="result">Сделай ставку и брось кубик</div>
  </div>

  <div class="label">Ставка</div>
  <div class="row" id="bets">
    <button class="opt" data-v="100">100</button>
    <button class="opt" data-v="500">500</button>
    <button class="opt" data-v="1000">1000</button>
  </div>
  <input class="custom" id="custom" type="number" inputmode="numeric" min="1" placeholder="Своя ставка">

  <div class="label">Твой выбор</div>
  <div class="row picks" id="picks">
    <button class="opt even" data-p="even">Чёт<small>2 · 4 · 6</small></button>
    <button class="opt odd" data-p="odd">Нечёт<small>1 · 3 · 5</small></button>
  </div>

  <button class="go-btn" id="go">🎲 Бросить кубик</button>
  <div class="hint">Выигрыш: ставка × 1.9 · игровая валюта без реальной ценности</div>
  <div class="history" id="history"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0d1c'); tg.setBackgroundColor('#0a0d1c'); } catch (e) {}
}

const START_BALANCE = 1000;
const BONUS_AMOUNT = 500;
const BONUS_COOLDOWN = 24 * 60 * 60 * 1000;
const MULT = 1.9;
const ROLL_MS = 1700;

const PIPS = {
  1: [4], 2: [0, 8], 3: [0, 4, 8],
  4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
};
/* какой поворот куба показывает нужную грань спереди */
const TARGET = {
  1: { x: 0,   y: 0 },
  6: { x: 0,   y: 180 },
  3: { x: 0,   y: -90 },
  4: { x: 0,   y: 90 },
  2: { x: -90, y: 0 },
  5: { x: 90,  y: 0 }
};

const $ = id => document.getElementById(id);
const cube = $('cube'), toss = $('toss'), shadow = $('shadow');
const resultEl = $('result'), balEl = $('bal'), goBtn = $('go');
const customEl = $('custom'), bonusBtn = $('bonus'), stage = $('stage');

let state = load();
let bet = 100, pick = null, rolling = false;
let curX = 0, curY = 0;

/* рисуем точки на гранях */
document.querySelectorAll('.face').forEach(f => {
  const n = +f.className.match(/f(\d)/)[1];
  for (let i = 0; i < 9; i++) {
    const p = document.createElement('div');
    p.className = 'pip' + (PIPS[n].includes(i) ? ' on' : '');
    f.appendChild(p);
  }
});

function load() {
  try {
    const s = JSON.parse(localStorage.getItem('dice_state'));
    if (s && typeof s.balance === 'number') return s;
  } catch (e) {}
  return { balance: START_BALANCE, lastBonus: 0, history: [] };
}
function save() {
  try { localStorage.setItem('dice_state', JSON.stringify(state)); } catch (e) {}
}

function setCube(x, y, animate) {
  cube.style.transition = animate ? '' : 'none';
  cube.style.transform = `rotateX(${x}deg) rotateY(${y}deg)`;
}

function render() {
  balEl.textContent = state.balance.toLocaleString('ru-RU');
  const left = BONUS_COOLDOWN - (Date.now() - state.lastBonus);
  bonusBtn.disabled = left > 0;
  bonusBtn.textContent = left > 0 ? '⏳ ' + Math.ceil(left / 3600000) + ' ч' : '🎁 +' + BONUS_AMOUNT;
  $('history').innerHTML = state.history.slice(-14).map(h =>
    `<b class="${h ? 'w' : 'l'}">${h ? '✓' : '✗'}</b>`).join('');
  goBtn.disabled = rolling;
}

function rand6() {
  const a = new Uint32Array(1);
  const limit = Math.floor(4294967296 / 6) * 6;
  do { crypto.getRandomValues(a); } while (a[0] >= limit);
  return (a[0] % 6) + 1;
}

function haptic(type) {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
}
function tick() {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
}

function say(text, cls) {
  resultEl.className = 'result ' + (cls || '');
  resultEl.textContent = text;
}

function confetti() {
  const colors = ['#ffe27a', '#35e08a', '#6ea8ff', '#ff7ad1', '#ffffff'];
  for (let i = 0; i < 34; i++) {
    const c = document.createElement('div');
    c.className = 'conf';
    c.style.background = colors[i % colors.length];
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 140;
    c.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    c.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animation = `fly ${.9 + Math.random() * .6}s ease-out forwards`;
    stage.appendChild(c);
    setTimeout(() => c.remove(), 1700);
  }
}

/* выбор ставки и чёт/нечёт */
document.querySelectorAll('#bets .opt').forEach(b => b.onclick = () => {
  bet = +b.dataset.v;
  customEl.value = '';
  customEl.classList.remove('sel');
  document.querySelectorAll('#bets .opt').forEach(x => x.classList.toggle('sel', x === b));
  tick();
});
customEl.oninput = () => {
  const v = Math.floor(+customEl.value);
  if (v > 0) {
    bet = v;
    customEl.classList.add('sel');
    document.querySelectorAll('#bets .opt').forEach(x => x.classList.remove('sel'));
  }
};
document.querySelectorAll('#picks .opt').forEach(b => b.onclick = () => {
  pick = b.dataset.p;
  document.querySelectorAll('#picks .opt').forEach(x => x.classList.toggle('sel', x === b));
  tick();
});

bonusBtn.onclick = () => {
  if (Date.now() - state.lastBonus < BONUS_COOLDOWN) return;
  state.balance += BONUS_AMOUNT;
  state.lastBonus = Date.now();
  save(); render();
  say('+' + BONUS_AMOUNT + ' ⭐ бонус получен', 'win');
  haptic('success');
};

goBtn.onclick = () => {
  if (rolling) return;
  if (!pick) return say('Выбери чёт или нечёт', 'lose');
  if (!bet || bet < 1) return say('Введи ставку', 'lose');
  if (bet > state.balance) return say('Не хватает звёзд на такую ставку', 'lose');

  rolling = true;
  state.balance -= bet;
  save(); render();
  say('Кубик летит...');

  const n = rand6();
  const t = TARGET[n];
  /* докручиваем минимум на 2-3 полных оборота вперёд до нужной грани */
  const spinsX = 2 + Math.floor(Math.random() * 2);
  const spinsY = 2 + Math.floor(Math.random() * 2);
  const nx = Math.ceil((curX + 360 * spinsX - t.x) / 360) * 360 + t.x;
  const ny = Math.ceil((curY + 360 * spinsY - t.y) / 360) * 360 + t.y;
  curX = nx; curY = ny;

  toss.classList.remove('go'); shadow.classList.remove('go');
  void toss.offsetWidth;
  toss.classList.add('go'); shadow.classList.add('go');
  setCube(nx, ny, true);

  const bounce = setInterval(tick, 380);

  setTimeout(() => {
    clearInterval(bounce);
    toss.classList.remove('go'); shadow.classList.remove('go');
    const isEven = n % 2 === 0;
    const won = (pick === 'even') === isEven;
    if (won) {
      const prize = Math.floor(bet * MULT);
      state.balance += prize;
      say(`Выпало ${n} · выигрыш +${prize - bet} ⭐`, 'win');
      haptic('success');
      confetti();
      $('balBox').classList.remove('pop'); void $('balBox').offsetWidth; $('balBox').classList.add('pop');
    } else {
      say(`Выпало ${n} · проигрыш −${bet} ⭐`, 'lose');
      haptic('error');
    }
    state.history.push(won ? 1 : 0);
    if (state.history.length > 50) state.history.shift();
    rolling = false;
    save(); render();
  }, ROLL_MS + 80);
};

setCube(0, 0, false);
document.querySelector('#bets .opt').click();
render();
setInterval(render, 60000);
</script>
</body>
</html>
